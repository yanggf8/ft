name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Rust compile check across the wasm crates (the API worker, the engine worker,
  # and the Leptos frontend). Deployment is manual via OAuth (wrangler deploy /
  # scripts/deploy-*.sh) — no API token in CI, matching the project's OAuth-first
  # policy and avoiding token permission issues.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy,rustfmt
      - name: fmt
        run: cargo fmt --all --check
      - name: test (native)
        run: cargo test --locked -p ft-schema -p ft-ziwei -p ft-western -p ft-big5 -p ft-api
      - name: clippy (wasm32)
        run: cargo clippy --locked --target wasm32-unknown-unknown --all-targets
      - name: build wasm crates
        run: cargo build --locked -p ft-worker -p ft-api -p ft-web --target wasm32-unknown-unknown
