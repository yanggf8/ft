[workspace]
members = [
  "crates/schema",
  "crates/domain/ziwei",
  "crates/domain/western",
  "crates/domain/big5",
  "crates/worker",
  "crates/api",
  "crates/web",
]
resolver = "2"

# Shared wasm tuning — opt-level=z + LTO keeps the .wasm small. Applies to every
# wasm crate (ft-web, ft-api, ft-worker); these flags are what made Phase A/B's
# workers ~340KB gzip.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Local patch of solar-ephemeris: promotes `Body::elements()` to pub so ft-western
# can feed each planet's &Planet into planet_apparent_ecliptic (geocentric apparent
# ecliptic longitude). Upstream keeps the accessor private; this is a one-line pub
# that lets us use the already-validated geocentric path instead of vsop87 heliocentric.
[patch.crates-io]
solar-ephemeris = { path = "vendor/solar-ephemeris" }
