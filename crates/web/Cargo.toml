[package]
name = "ft-web"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
ft-schema = { path = "../schema" }
leptos = { version = "0.8.20", features = ["csr"] }
leptos_router = "0.8.15"
gloo-net = { version = "0.7", features = ["http"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Storage", "EventTarget"] }
console_error_panic_hook = "0.1"
