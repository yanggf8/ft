name = "fortunet-api"
main = "build/worker/shim.mjs"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# Durable Objects — same class_names as the JS worker so the in-place deploy keeps
# existing session + AI-metric storage bit-compatible (Stage B single-way gate).
[[durable_objects.bindings]]
name = "SESSION_DO"
class_name = "SessionDO"

[[durable_objects.bindings]]
name = "AI_MUTEX"
class_name = "AIMutexDO"

# P2-02 — cross-isolate rate limiting (sharded rl:0..rl:7 instance names).
[[durable_objects.bindings]]
name = "RATE_LIMIT"
class_name = "RateLimitDO"

# R2 Storage
[[r2_buckets]]
binding = "STORAGE"
bucket_name = "fortunet-storage"

# Rust engine Worker (service binding) — the chart calculator.
[[services]]
binding = "FT_ENGINE"
service = "fortunet-engine"

# Environment variables
[vars]
ENVIRONMENT = "development"
# Turso (libSQL) database, replacing the former D1 `DB` binding. The URL is not
# a secret; the matching TURSO_AUTH_TOKEN is (`wrangler secret put`). Mint one
# with `gwebcdb-mint turso --tier write --db fortunet --export` — a group token
# covers every database in the group.
TURSO_URL = "libsql://fortunet-yanggf8.aws-ap-northeast-1.turso.io"
# Magic-link sender (audit P0-01). onboarding@resend.dev is Resend's test
# sender: it only delivers to the Resend account owner's own email. Swap to a
# verified domain address before opening registration to real users.
MAIL_FROM = "onboarding@resend.dev"
# Invite-system admin (spec 2026-08-30). The session email matching this value
# (case-insensitive) may manage invites; unset = nobody (fail-closed).
ADMIN_EMAIL = "yanggf@msn.com"

# CORS extra exact origins (comparisons are scheme+host+port, never substring).
# Pages preview deployments get hashed origins like
# https://abc12345.fortunet.pages.dev — each preview origin must be listed
# here explicitly after deploying a preview, or preview previews fail CORS.
ALLOWED_ORIGINS = ""

# Migrations — MUST stay identical to the JS worker's existing tags (v1/v2) so the
# class_names are already in `new_sqlite_classes` and are NOT re-run.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["SessionDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["AIMutexDO"]

# P2-02 — RateLimitDO joins in a NEW tag; v1/v2 stay untouched so the existing
# SessionDO/AIMutexDO classes are never re-migrated.
[[migrations]]
tag = "v3"
new_sqlite_classes = ["RateLimitDO"]
