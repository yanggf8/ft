[package]
name = "ft-api"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
ft-schema = { path = "../schema" }
worker = { version = "0.8.5", features = ["d1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Crypto"] }
futures-channel = "0.3"
futures-util = "0.3"
